services:
  api:
    build:
      context: ./python
    ports:
      - "8000:8000"
    environment:
      - ECOM_LLM_API_KEY=${ECOM_LLM_API_KEY:-}
      - ECOM_LLM_BASE_URL=${ECOM_LLM_BASE_URL:-https://api.openai.com/v1}
      - ECOM_LLM_MODEL=${ECOM_LLM_MODEL:-gpt-4o-mini}
      - ECOM_LLM_DISABLE_THINKING=${ECOM_LLM_DISABLE_THINKING:-false}
    restart: unless-stopped
